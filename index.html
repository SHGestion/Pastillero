<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pastillero</title>
<meta name="description" content="Recordatorio de medicamentos, control de stock y agenda de citas y exámenes médicos.">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pastillero">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  --bg:#f5f4f0; --card:#ffffff; --ink:#1c1f23; --muted:#667079; --line:#e4e2dc;
  --pri:#0f766e; --pri-ink:#ffffff; --pri-soft:#e3f2ef;
  --ok:#15803d; --ok-soft:#e6f4ea; --warn:#b45309; --warn-soft:#fdf1dc;
  --bad:#b91c1c; --bad-soft:#fde8e8; --radius:16px;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121416; --card:#1c1f22; --ink:#eef0f1; --muted:#9aa3ab; --line:#2c3135;
    --pri:#2bb3a3; --pri-ink:#04201d; --pri-soft:#173430;
    --ok:#4ade80; --ok-soft:#16301f; --warn:#fbbf24; --warn-soft:#33280f;
    --bad:#f87171; --bad-soft:#3a1717; --shadow:none; color-scheme: dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:17px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);
  padding:calc(10px + env(safe-area-inset-top)) 18px 10px;display:flex;align-items:center;gap:12px;
  border-bottom:1px solid transparent}
header.top.scrolled{border-bottom-color:var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;letter-spacing:-.01em}
.brand svg{width:30px;height:30px}
.chip-profile{margin-left:auto;border:1px solid var(--line);background:var(--card);border-radius:999px;
  padding:6px 12px 6px 8px;display:flex;align-items:center;gap:8px;font-size:15px;cursor:pointer;max-width:50%}
.chip-profile .av{width:24px;height:24px;border-radius:50%;background:var(--pri);color:var(--pri-ink);
  display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.chip-profile span.n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{padding:6px 16px 24px;max-width:640px;margin:0 auto}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:24px 4px 10px;font-weight:600}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line)}
.pad{padding:16px}
.muted{color:var(--muted)}
.small{font-size:14px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;cursor:pointer;background:var(--pri-soft);color:var(--pri);
  min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--pri);color:var(--pri-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.bad{background:var(--bad-soft);color:var(--bad)}
.btn.block{width:100%}
.btn.sm{min-height:38px;padding:8px 12px;font-size:15px;border-radius:10px}
.btn:disabled{opacity:.45}
.iconbtn{border:0;background:transparent;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.iconbtn:active{background:var(--line)}

/* Day nav */
.daynav{display:flex;align-items:center;justify-content:space-between;margin:6px 0 4px}
.daynav .t{font-size:22px;font-weight:700;text-transform:capitalize;letter-spacing:-.01em}
.daynav .s{font-size:14px;color:var(--muted)}

/* Hero */
.hero{background:var(--pri);color:var(--pri-ink);border-radius:20px;padding:18px;margin-top:12px}
.hero .k{font-size:13px;text-transform:uppercase;letter-spacing:.08em;opacity:.85;font-weight:600}
.hero .m{font-size:24px;font-weight:700;margin-top:4px;line-height:1.2}
.hero .d{opacity:.9;margin-top:2px}
.hero .hm{font-size:21px;font-weight:700;margin-top:10px;line-height:1.2}
.hero .w{font-size:15px;margin-top:10px;font-weight:600;opacity:.95}
.hero.done{background:var(--ok-soft);color:var(--ok)}

.alert{border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;margin-top:10px;font-size:15px}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.bad{background:var(--bad-soft);color:var(--bad)}
.alert.info{background:var(--pri-soft);color:var(--pri)}
.alert b{font-weight:700}
.alert .x{margin-left:auto}

/* Dose list */
.dose{display:flex;align-items:center;gap:12px;padding:14px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.dose:last-child{border-bottom:0}
.dose .time{font-variant-numeric:tabular-nums;font-weight:700;font-size:18px;width:56px;flex:none}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.dose .nm{font-weight:600;line-height:1.25}
.dose .sub{font-size:14px;color:var(--muted)}
.dose.taken .nm,.dose.skipped .nm{color:var(--muted)}
.dose.taken .time,.dose.skipped .time{color:var(--muted)}
.tag{font-size:13px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.late{background:var(--bad-soft);color:var(--bad)}
.tag.now{background:var(--warn-soft);color:var(--warn)}
.tag.skip{background:var(--line);color:var(--muted)}
.tag.pend{background:transparent;color:var(--muted);border:1px solid var(--line)}
.take{border:0;background:var(--pri);color:var(--pri-ink);font-weight:700;border-radius:12px;min-width:84px;min-height:44px;padding:0 14px;cursor:pointer}
.take.soft{background:var(--pri-soft);color:var(--pri)}
.take:disabled{background:var(--line);color:var(--muted);cursor:default;font-weight:600}
.tag.done{font-size:15px;padding:5px 10px;background:var(--ok-soft);color:var(--ok);font-weight:700}

/* Med cards */
.med{padding:16px;margin-bottom:12px}
.med .nm{font-size:19px;font-weight:700;line-height:1.2}
.med .sch{font-size:15px;color:var(--muted);margin-top:2px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:12px 0 6px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--ok)}
.bar.warn i{background:var(--warn)}
.bar.bad i{background:var(--bad)}
.stockline{display:flex;justify-content:space-between;gap:8px;font-size:15px;flex-wrap:wrap}
.med .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.med.off{opacity:.55}
body.v-meds main,body.v-citas main{padding-bottom:90px}
.empty{text-align:center;padding:36px 20px}
.empty svg{width:72px;height:72px;opacity:.9}
.empty .t{font-weight:700;font-size:19px;margin:10px 0 4px}

/* History */
.hday{margin-top:16px}
.hday .h{display:flex;justify-content:space-between;align-items:baseline;margin:0 4px 6px;font-weight:700;text-transform:capitalize}
.hitem{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);font-size:15px}
.hitem:last-child{border-bottom:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.stat{padding:12px;text-align:center}
.stat .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .l{font-size:13px;color:var(--muted)}

/* Settings list */
.set{padding:14px 16px;border-bottom:1px solid var(--line)}
.set:last-child{border-bottom:0}
.set .t{font-weight:600}
.set .d{font-size:14px;color:var(--muted);margin-top:2px}
.set .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

/* Bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav.tabs button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 0;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;border-radius:12px;max-width:120px;min-width:0}
nav.tabs button svg{width:26px;height:26px}
nav.tabs button.on{color:var(--pri)}
.fab{position:fixed;right:18px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:6;border:0;border-radius:18px;
  background:var(--pri);color:var(--pri-ink);height:58px;padding:0 20px;font-weight:700;display:flex;align-items:center;gap:8px;
  box-shadow:0 6px 18px rgba(15,118,110,.35);cursor:pointer}
.fab svg{width:22px;height:22px}
.fab[hidden]{display:none}
.set.switch{padding:14px 16px}

/* Sheet */
dialog.sheet{border:0;padding:0;margin:auto auto 0;width:100%;max-width:640px;max-height:92vh;border-radius:22px 22px 0 0;
  background:var(--card);color:var(--ink)}
dialog.sheet::backdrop{background:rgba(0,0,0,.4)}
@media (min-width:700px){dialog.sheet{margin:auto;border-radius:22px}}
.sheet .hd{position:sticky;top:0;background:var(--card);padding:14px 16px 10px;display:flex;align-items:center;gap:8px;
  border-bottom:1px solid var(--line);z-index:1}
.sheet .hd .t{font-weight:700;font-size:19px;flex:1}
.sheet .bd{padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.field{margin-bottom:16px}
.field label.l{display:block;font-weight:600;font-size:15px;margin-bottom:6px}
.field .hint{font-size:13px;color:var(--muted);margin-top:4px}
.in{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;min-height:48px;outline:none}
.in:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-soft)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:12px;min-height:46px;font-weight:600;font-size:15px;cursor:pointer;padding:6px}
.seg button.on{border-color:var(--pri);background:var(--pri-soft);color:var(--pri)}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-weight:700;cursor:pointer}
.days button.on{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.colors{display:flex;gap:10px;flex-wrap:wrap}
.colors button{width:36px;height:36px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.colors button.on{border-color:var(--ink)}
.timerow{display:flex;gap:8px;margin-bottom:8px}
.timerow .in{flex:1}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
.switch input{width:52px;height:30px;appearance:none;background:var(--line);border-radius:99px;position:relative;cursor:pointer;flex:none;transition:.2s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.switch input:checked{background:var(--pri)}
.switch input:checked::after{left:25px}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.prof{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.prof:last-child{border-bottom:0}
.prof .av{width:36px;height:36px;border-radius:50%;background:var(--pri);color:var(--pri-ink);display:grid;place-items:center;font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  background:#1c1f23;color:#fff;padding:12px 18px;border-radius:14px;font-size:15px;opacity:0;transition:.25s;z-index:50;
  max-width:90vw;text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.appt{display:flex;gap:14px;padding:14px;border-bottom:1px solid var(--line);cursor:pointer;align-items:flex-start}
.appt:last-child{border-bottom:0}
.appt .cal{width:56px;flex:none;text-align:center;border-radius:12px;background:var(--pri-soft);color:var(--pri);padding:6px 0}
.appt .cal .m{font-size:12px;font-weight:700;text-transform:uppercase}
.appt .cal .d{font-size:24px;font-weight:800;line-height:1.1}
.appt .cal .w{font-size:12px}
.appt .cal.nd{background:var(--warn-soft);color:var(--warn)}
.appt .nm{font-weight:700;line-height:1.25}
.appt .sub{font-size:14px;color:var(--muted)}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--line);padding:4px;border-radius:14px}
.seg3 button{border:0;background:transparent;border-radius:10px;min-height:42px;font-weight:600;font-size:14px;cursor:pointer;color:var(--muted);padding:4px}
.seg3 button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.thumbs{display:flex;gap:10px;flex-wrap:wrap}
.thumb{width:84px;height:84px;border-radius:12px;border:1px solid var(--line);background:var(--bg) center/cover no-repeat;display:grid;place-items:center;font-size:30px;cursor:pointer;overflow:hidden}
.kv{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.kv .k{width:26px;flex:none;text-align:center}
.spin{width:40px;height:40px;border:4px solid var(--pri-soft);border-top-color:var(--pri);border-radius:50%;animation:sp 1s linear infinite;margin:18px auto 6px}
@keyframes sp{to{transform:rotate(360deg)}}
.rev{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
textarea.in{min-height:80px;resize:vertical}
.steps{margin:6px 0 0;padding-left:20px;font-size:15px}
.steps li{margin:4px 0}
select.in{appearance:auto}
</style>
</head>
<body>
<header class="top" id="top">
  <div class="brand">
    <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#0f766e"/><g transform="rotate(-40 32 32)"><rect x="12" y="23" width="40" height="18" rx="9" fill="#fff"/><path d="M32 23h11a9 9 0 0 1 0 18H32z" fill="#99e0d6"/></g></svg>
    Pastillero
  </div>
  <button class="chip-profile" id="profileChip" aria-label="Cambiar persona"><span class="av" id="profileAv"></span><span class="n" id="profileName"></span></button>
</header>

<main id="view"></main>

<button class="fab" id="fab" hidden>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  Agregar
</button>

<nav class="tabs" id="tabs">
  <button data-v="hoy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Hoy</button>
  <button data-v="meds"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="8" rx="4" transform="rotate(-35 12 12)"/><path d="M9.6 8.6l4.8 6.8"/></svg>Medicamentos</button>
  <button data-v="citas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4M12 13v5M9.5 15.5h5"/></svg>Citas</button>
  <button data-v="hist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16M4 12h16M4 19h10"/></svg>Historial</button>
  <button data-v="ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Ajustes</button>
</nav>

<dialog class="sheet" id="sheet"></dialog>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* =========================================================
   Pastillero — recordatorio de medicamentos (PWA)
   Datos: localStorage del propio dispositivo (no se envían a ningún servidor)
   ========================================================= */

// ---------- utilidades ----------
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const hm = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const startOfDay = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const dayDiff = (a, b) => Math.round((startOfDay(b) - startOfDay(a)) / 86400000);
const atTime = (day, t) => { const [h, m] = t.split(':').map(Number); const d = new Date(day); d.setHours(h, m, 0, 0); return d; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = n => Number(n).toLocaleString('es-CL', { maximumFractionDigits: 2 });
const fmtDayLong = d => d.toLocaleDateString('es-CL', { weekday: 'long', day: 'numeric', month: 'long' });
const fmtDayShort = d => d.toLocaleDateString('es-CL', { weekday: 'short', day: 'numeric', month: 'short' });
const DOW = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
const DOW1 = ['D', 'L', 'M', 'X', 'J', 'V', 'S'];
const COLORS = ['#0f766e', '#2563eb', '#7c3aed', '#db2777', '#ea580c', '#ca8a04', '#16a34a', '#475569'];
const UNITS = {
  'comprimido': 'comprimidos', 'cápsula': 'cápsulas', 'gota': 'gotas', 'ml': 'ml', 'sobre': 'sobres',
  'inhalación': 'inhalaciones', 'aplicación': 'aplicaciones', 'ampolla': 'ampollas', 'parche': 'parches',
  'unidad': 'unidades', 'UI': 'UI'
};
const VERBS = { inhalación: ['Inhalar', 'Inhalado'], aplicación: ['Aplicar', 'Aplicado'], parche: ['Aplicar', 'Aplicado'], ampolla: ['Aplicar', 'Aplicado'], UI: ['Aplicar', 'Aplicado'] };
const verb = m => { const v = VERBS[m && m.unit] || ['Tomar', 'Tomado']; return { act: v[0], done: v[1] }; };
const EARLY_MIN = 30; // minutos antes de la hora en que se habilita el botón
const qty = (n, unit) => `${num(n)} ${Number(n) === 1 ? unit : (UNITS[unit] || unit)}`;

// ---------- estado ----------
const KEY = 'pastillero_v1';
let S;
function defaultState() {
  const p = { id: uid(), name: 'Yo' };
  return { v: 1, profiles: [p], active: p.id, meds: [], logs: [], settings: { sound: true }, notified: {} };
}
function load() {
  try { const r = localStorage.getItem(KEY); S = r ? JSON.parse(r) : defaultState(); }
  catch (e) { S = defaultState(); }
  S.profiles ||= []; S.meds ||= []; S.logs ||= []; S.settings ||= { sound: true }; S.notified ||= {}; S.appts ||= [];
  if (!S.profiles.length) S.profiles.push({ id: uid(), name: 'Yo' });
  if (!S.profiles.find(p => p.id === S.active)) S.active = S.profiles[0].id;
  // limpiar marcas de notificación antiguas (> 3 días)
  const lim = ymd(addDays(new Date(), -3));
  for (const k of Object.keys(S.notified)) {
    const v = S.notified[k];
    const d = (k.startsWith('stock|') || k.startsWith('appt|')) ? v : k.split('|')[1];
    if (!d || d < lim) delete S.notified[k];

}

// ---------- motor de horarios ----------
function scheduleTimes(m, day) {
  if (!m.active) return [];
  const s = m.schedule, ds = ymd(day);
  if (m.startDate && ds < m.startDate) return [];
  if (m.endDate && ds > m.endDate) return [];
  switch (s.type) {
    case 'daily': return [...s.times];
    case 'weekly': return s.weekdays.includes(day.getDay()) ? [...s.times] : [];
    case 'ndays': {
      const diff = dayDiff(parseYmd(m.startDate || ds), day);
      return diff >= 0 && diff % s.everyDays === 0 ? [...s.times] : [];
    }
    case 'hours': {
      const N = Number(s.everyHours), out = [];
      if (24 % N === 0) {
        const [h, mi] = s.startTime.split(':').map(Number);
        for (let k = 0; k < 24 / N; k++) out.push(pad((h + k * N) % 24) + ':' + pad(mi));
        return m.startDate === ds ? out.filter(t => t >= s.startTime) : out;
      }
      const anchor = atTime(parseYmd(m.startDate || ds), s.startTime).getTime();
      const step = N * 3600000, d0 = startOfDay(day).getTime(), d1 = d0 + 86400000;
      let k = Math.max(0, Math.ceil((d0 - anchor) / step));
      for (let t = anchor + k * step; t < d1; t += step) out.push(hm(new Date(t)));
      return out;
    }
  }
  return [];
}
function dosesForDay(m, day) {
  const d0 = startOfDay(day);
  return [...new Set(scheduleTimes(m, d0))].sort().map(t => ({ key: `${m.id}|${ymd(d0)}|${t}`, med: m, t, time: atTime(d0, t) }));
}
function scheduleText(m) {
  const s = m.schedule, times = (s.times || []).join(', ');
  switch (s.type) {
    case 'daily': return `Todos los días · ${times}`;
    case 'weekly': return `${s.weekdays.slice().sort((a, b) => ((a + 6) % 7) - ((b + 6) % 7)).map(d => DOW[d]).join(', ')} · ${times}`;
    case 'ndays': return `Cada ${s.everyDays} días · ${times}`;
    case 'hours': return `Cada ${s.everyHours} h desde las ${s.startTime}`;
  }
  return '';
}
// Simula las tomas futuras para saber cuándo se acaba el stock
function runOut(m) {
  if (!m.active) return null;
  const p = Number(m.perDose) || 0; if (p <= 0) return null;
  let stock = Number(m.stock) || 0;
  const now = Date.now(), lm = logMap();
  let day = startOfDay(new Date());
  for (let i = 0; i < 400; i++) {
    if (m.endDate && ymd(day) > m.endDate) return { endOk: true };
    for (const d of dosesForDay(m, day)) {
      if (d.time.getTime() < now || lm.has(d.key)) continue;
      if (stock + 1e-9 < p) return { date: d.time, days: Math.max(0, (d.time.getTime() - now) / 86400000) };
      stock -= p;
    }
    day = addDays(day, 1);
  }
  return { long: true };
}
function stockStatus(m) {
  const r = runOut(m), alertDays = Number(m.alertDays ?? 5);
  if (!r) return { level: 'none', text: '', r };
  if (r.endOk) return { level: 'ok', text: 'Alcanza hasta el fin del tratamiento', r };
  if (r.long) return { level: 'ok', text: 'Alcanza para más de un año', r };
  const d = Math.floor(r.days);
  const level = Number(m.stock) < Number(m.perDose) ? 'bad' : (r.days <= alertDays ? (r.days <= 2 ? 'bad' : 'warn') : 'ok');
  let text;
  if (Number(m.stock) < Number(m.perDose)) text = 'Sin stock suficiente para la próxima toma';
  else if (d < 1) text = 'Alcanza para menos de 1 día';
  else text = `Alcanza para ${d} ${d === 1 ? 'día' : 'días'} · hasta ${fmtDayShort(r.date)}`;
  return { level, text, r, days: r.days };
}

// ---------- registro de tomas ----------
function takeDose(key, when) {
  stopSound();
  const [medId] = key.split('|'); const m = medById(medId); if (!m) return;
  if (logMap().has(key)) return;
  const units = Math.min(Number(m.perDose) || 0, Math.max(0, Number(m.stock) || 0));
  const parts = key.split('|');
  S.logs.push({ id: uid(), profileId: m.profileId, medId, key, scheduled: parts[1] !== 'extra' ? `${parts[1]}T${parts[2]}` : null,
    takenAt: (when || new Date()).toISOString(), status: 'taken', units });
  m.stock = Math.round((Number(m.stock) - units) * 100) / 100;
  save();
}
function skipDose(key) {
  const [medId] = key.split('|'); const m = medById(medId); if (!m || logMap().has(key)) return;
  const parts = key.split('|');
  S.logs.push({ id: uid(), profileId: m.profileId, medId, key, scheduled: `${parts[1]}T${parts[2]}`, takenAt: new Date().toISOString(), status: 'skipped', units: 0 });
  save();
}
function undoDose(key) {
  const i = S.logs.findIndex(l => l.key === key); if (i < 0) return;
  const l = S.logs[i], m = medById(l.medId);
  if (m && l.status === 'taken') m.stock = Math.round((Number(m.stock) + Number(l.units || 0)) * 100) / 100;
  S.logs.splice(i, 1); save();
}

function doseState(d, now) {
  const l = logMap().get(d.key);
  if (l) return l.status === 'taken' ? { cls: 'taken', tag: `<span class="tag done">✓ ${verb(d.med).done} a las ${hm(new Date(l.takenAt))}</span>` } : { cls: 'skipped', tag: '<span class="tag skip">Omitida</span>' };
  const diff = now - d.time.getTime();
  if (diff < -EARLY_MIN * 60000) return { cls: 'pend', tag: '', btn: 'locked' };
  if (diff < 0) return { cls: 'pend', tag: '', btn: 'soft' };
  if (diff <= 30 * 60000) return { cls: 'now', tag: '<span class="tag now">Ahora</span>', btn: 'pri' };
  return { cls: 'late', tag: '<span class="tag late">Atrasada</span>', btn: 'pri' };
}
function nextDose() {
  const now = Date.now(), lm = logMap();
  let best = null;
  for (let i = 0; i < 8 && !best; i++) {
    const day = addDays(startOfDay(new Date()), i);
    for (const m of myMeds()) for (const d of dosesForDay(m, day)) {
      if (lm.has(d.key) || d.time.getTime() < now - 30 * 60000) continue;
      if (!best || d.time < best.time) best = d;
    }
  }
  return best;
}

  const mins = Math.round((t - Date.now()) / 60000);

  if (mins < 60) return `En ${mins} min`;
  const h = Math.floor(mins / 60), mm = mins % 60;
  if (h < 24) return `En ${h} h${mm ? ' ' + mm + ' min' : ''}`;
  return fmtDayLong(t);
}

// ---------- Vista: HISTORIAL ----------
function histRows(days) {
  // devuelve [{day, items:[{time, med, status, scheduled, takenAt}]}]
  const now = Date.now(), out = [], lm = logMap();
  const meds = myMeds().filter(m => !histFilter || m.id === histFilter);
  const medIds = new Set(meds.map(m => m.id));
  for (let i = 0; i < days; i++) {
    const day = addDays(startOfDay(new Date()), -i), ds = ymd(day), items = [];
    for (const m of meds) for (const d of dosesForDay(m, day)) {
      if (d.time.getTime() > now) continue;
      const l = lm.get(d.key);
      items.push({ sort: d.t, med: m, scheduled: d.t, status: l ? l.status : 'missed', takenAt: l ? new Date(l.takenAt) : null });
    }
    // tomas extra y tomas registradas de horarios que ya no existen
    for (const l of S.logs) {
      if (!medIds.has(l.medId) || l.status !== 'taken') continue;
      const tk = new Date(l.takenAt);
      if (l.key.includes('|extra|') && ymd(tk) === ds) items.push({ sort: hm(tk), med: medById(l.medId), scheduled: null, status: 'extra', takenAt: tk });
    }
    items.sort((a, b) => a.sort.localeCompare(b.sort));
    out.push({ day, items });
  }
  return out;
}
function renderHist() {
  const meds = myMeds();
  const rows = histRows(30);
  const last7 = rows.slice(0, 7).flatMap(r => r.items).filter(i => i.status !== 'extra');
  const taken = last7.filter(i => i.status === 'taken').length, missed = last7.filter(i => i.status === 'missed').length;
  const adh = last7.length ? Math.round(taken / last7.length * 100) : null;
  const onTime = last7.filter(i => i.status === 'taken' && i.takenAt && Math.abs(i.takenAt - atTime(startOfDay(i.takenAt), i.scheduled)) <= 30 * 60000).length;
  let h = `<h2>Últimos 7 días</h2><div class="stats">
    <div class="card stat"><div class="v">${adh == null ? '—' : adh + '%'}</div><div class="l">Cumplimiento</div></div>
    <div class="card stat"><div class="v">${onTime}</div><div class="l">A la hora (±30 min)</div></div>
    <div class="card stat"><div class="v" style="${missed ? 'color:var(--bad)' : ''}">${missed}</div><div class="l">Sin registrar</div></div></div>
    <div class="row" style="margin-top:16px"><select class="in grow" id="hFilter"><option value="">Todos los medicamentos</option>${meds.map(m => `<option value="${m.id}" ${m.id === histFilter ? 'selected' : ''}>${esc(m.name)}</option>`).join('')}</select>
    <button class="btn ghost" id="hCsv">CSV</button></div>`;
  let any = false;
  for (const r of rows) {
    if (!r.items.length) continue; any = true;
    const tk = r.items.filter(i => i.status === 'taken').length, tot = r.items.filter(i => i.status !== 'extra').length;
    h += `<div class="hday"><div class="h"><span>${esc(dayLabel(r.day))}</span><span class="small muted" style="font-weight:600">${tk}/${tot}</span></div><div class="card">`;
    for (const i of r.items) {
      const tag = i.status === 'taken' ? `<span class="tag done">✓ ${verb(i.med).done} ${hm(i.takenAt)}</span>` : i.status === 'skipped' ? '<span class="tag skip">Omitida</span>' : i.status === 'extra' ? `<span class="tag ok">Extra ${hm(i.takenAt)}</span>` : '<span class="tag late">Sin registro</span>';
      h += `<div class="hitem"><span style="width:48px;font-weight:700;font-variant-numeric:tabular-nums" class="${i.scheduled ? '' : 'muted'}">${i.scheduled || '—'}</span>
        <span class="dot" style="background:${esc(i.med.color)}"></span><div class="grow">${esc(i.med.name)}${i.med.dose ? ' <span class="muted">' + esc(i.med.dose) + '</span>' : ''}</div>${tag}</div>`;
    }
    h += `</div></div>`;
  }
  if (!any) h += `<div class="card pad muted" style="margin-top:16px">Aún no hay tomas en el historial.</div>`;
  $('#view').innerHTML = h;
  $('#hFilter').onchange = e => { histFilter = e.target.value; renderHist(); };
  $('#hCsv').onclick = exportCSV;
}
function dayLabel(d) {
  const diff = dayDiff(d, new Date());
  return diff === 0 ? 'Hoy' : diff === 1 ? 'Ayer' : fmtDayLong(d);
}
function exportCSV() {
  const rows = histRows(365).reverse();
  const lines = [['Fecha', 'Hora programada', 'Hora tomada', 'Medicamento', 'Concentración', 'Cantidad', 'Estado'].join(';')];
  const st = { taken: 'Tomada', skipped: 'Omitida', missed: 'Sin registro', extra: 'Toma extra' };
  for (const r of rows) for (const i of r.items)
    lines.push([ymd(r.day), i.scheduled || '', i.takenAt ? ymd(i.takenAt) + ' ' + hm(i.takenAt) : '', i.med.name, i.med.dose || '', qty(i.med.perDose, i.med.unit), st[i.status]]
      .map(v => `"${String(v).replace(/"/g, '""')}"`).join(';'));
  saveFile(`historial_${slug(profile().name)}_${ymd(new Date())}.csv`, '\ufeff' + lines.join('\r\n'), 'text/csv');
}
const slug = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/gi, '_').toLowerCase();

// ---------- calendario (.ics) ----------
function icsEsc(s) { return String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n'); }
function icsFold(line) {
  const cps = Array.from(line); if (new TextEncoder().encode(line).length <= 74) return line;
  const out = []; let cur = '', len = 0;
  for (const c of cps) {
    const b = new TextEncoder().encode(c).length;
    if (len + b > (out.length ? 73 : 74)) { out.push(cur); cur = ''; len = 0; }
    cur += c; len += b;
  }
  out.push(cur); return out.join('\r\n ');
}
function buildICS(meds) {
  const fmt = d => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Pastillero//ES', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:Pastillero'];
  const today = startOfDay(new Date()), now = Date.now();
  const BY = ['SU', 'MO', 'TU', 'WE', 'TH', 'FR', 'SA'];
  for (const m of meds) {
    if (!m.active) continue;
    const s = m.schedule;
    let start = m.startDate && parseYmd(m.startDate) > today ? parseYmd(m.startDate) : today;
    const until = m.endDate ? `;UNTIL=${m.endDate.replace(/-/g, '')}T235959` : '';
    const summary = `💊 ${m.name}${m.dose ? ' ' + m.dose : ''} · ${qty(m.perDose, m.unit)}`;
    const ev = (dt, rrule, sfx) => {
      L.push('BEGIN:VEVENT', `UID:${m.id}-${sfx}@pastillero`, `DTSTAMP:${stamp}`, `DTSTART:${fmt(dt)}`, `DTEND:${fmt(new Date(dt.getTime() + 10 * 60000))}`,
        rrule ? `RRULE:${rrule}${until}` : '', `SUMMARY:${icsEsc(summary)}`, m.notes ? `DESCRIPTION:${icsEsc(m.notes)}` : '',
        'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsEsc('Tomar ' + m.name)}`, 'TRIGGER:PT0S', 'END:VALARM', 'END:VEVENT');
    };
    if (s.type === 'daily' || (s.type === 'hours' && 24 % s.everyHours === 0)) {
      const times = s.type === 'daily' ? s.times : scheduleTimes({ ...m, startDate: '' }, today);
      times.forEach(t => ev(atTime(start, t), 'FREQ=DAILY', t.replace(':', '')));
    } else if (s.type === 'weekly') {
      let d = new Date(start); for (let i = 0; i < 7 && !s.weekdays.includes(d.getDay()); i++) d = addDays(d, 1);
      s.times.forEach(t => ev(atTime(d, t), `FREQ=WEEKLY;BYDAY=${s.weekdays.map(x => BY[x]).join(',')}`, t.replace(':', '')));
    } else if (s.type === 'ndays') {
      let d = new Date(start);
      for (let i = 0; i < s.everyDays && dayDiff(parseYmd(m.startDate || ymd(start)), d) % s.everyDays !== 0; i++) d = addDays(d, 1);
      s.times.forEach(t => ev(atTime(d, t), `FREQ=DAILY;INTERVAL=${s.everyDays}`, t.replace(':', '')));
    } else if (s.type === 'hours') {
      let first = null;
      for (let i = 0; i < 4 && !first; i++) first = dosesForDay(m, addDays(start, i)).find(x => x.time.getTime() >= now) || null;
      if (first) ev(first.time, `FREQ=HOURLY;INTERVAL=${s.everyHours}`, 'h');
    }
    // aviso de reposición de stock
    const st = stockStatus(m);
    if (st.r && st.r.date) {
      const ad = Number(m.alertDays ?? 5);
      let when = atTime(startOfDay(new Date(st.r.date.getTime() - ad * 86400000)), '10:00');
      if (when.getTime() > now) {
        L.push('BEGIN:VEVENT', `UID:${m.id}-stock-${ymd(when)}@pastillero`, `DTSTAMP:${stamp}`, `DTSTART:${fmt(when)}`, `DTEND:${fmt(new Date(when.getTime() + 15 * 60000))}`,
          `SUMMARY:${icsEsc(`🛒 Comprar ${m.name} — queda stock para ${ad} días`)}`, `DESCRIPTION:${icsEsc(`Se acaba aprox. el ${fmtDayLong(st.r.date)}. Al reponer, actualiza el stock en Pastillero.`)}`,
          'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsEsc('Comprar ' + m.name)}`, 'TRIGGER:PT0S', 'END:VALARM', 'END:VEVENT');
      }
    }
  }
  icsAppts(L, stamp, fmt);
  L.push('END:VCALENDAR');
  return L.filter(Boolean).map(icsFold).join('\r\n') + '\r\n';
}
function exportICS() {
  const meds = myMeds().filter(m => m.active);

  else if (apptOverdue(a)) tag = '<span class="tag late">¿Se realizó?</span>';
  else if (rel) tag = `<span class="tag ${rel === 'Hoy' || rel === 'Mañana' ? 'now' : 'pend'}">${rel}</span>`;
  const nAtt = (a.attachments || []).length;
  return `<div class="appt" data-appt="${a.id}">
    <div class="cal ${d ? '' : 'nd'}">${d ? `<div class="m">${esc(d.toLocaleDateString('es-CL', { month: 'short' }).replace('.', ''))}</div><div class="d">${d.getDate()}</div><div class="w">${DOW[d.getDay()]}</div>` : '<div class="d" style="font-size:22px">?</div><div class="w">sin fecha</div>'}</div>
    <div class="grow"><div class="small muted">${t.i} ${t.l}${a.date ? (a.time ? ' · ' + esc(a.time) : ' · sin hora') : ''}</div>
      <div class="nm">${esc(a.title)}</div>
      ${a.professional ? `<div class="sub">${esc(a.professional)}</div>` : ''}
      ${!compact && a.place ? `<div class="sub">📍 ${esc(a.place)}</div>` : ''}
      ${compact && a.prep && a.status === 'pendiente' ? `<div class="sub" style="color:var(--warn)">⚠ ${esc(a.prep)}</div>` : ''}
      ${tag || nAtt ? `<div style="margin-top:6px">${tag}${nAtt ? ` <span class="small muted">📎 ${nAtt}</span>` : ''}</div>` : ''}
    </div></div>`;
}
function renderCitas() {
  const all = myAppts();
  const prox = all.filter(a => a.status === 'pendiente').sort((a, b) => apptSortKey(a).localeCompare(apptSortKey(b)));
  const porAg = all.filter(a => a.status === 'poragendar').sort((a, b) => (b.created || '').localeCompare(a.created || ''));
  const hist = all.filter(a => a.status === 'realizada' || a.status === 'cancelada').sort((a, b) => apptSortKey(b).localeCompare(apptSortKey(a)));
  const lists = { prox, porag: porAg, hist };
  let h = `<h2>Citas y exámenes de ${esc(profile().name)}</h2>
    <div class="grid2"><button class="btn pri" id="cScan">📷 Leer orden o captura</button><button class="btn ghost" id="cManual">✍️ Ingresar a mano</button></div>
    <div class="seg3" style="margin-top:16px">
      <button data-ct="prox" class="${citasTab === 'prox' ? 'on' : ''}">Próximas (${prox.length})</button>
      <button data-ct="porag" class="${citasTab === 'porag' ? 'on' : ''}">Por agendar (${porAg.length})</button>
      <button data-ct="hist" class="${citasTab === 'hist' ? 'on' : ''}">Historial</button></div>`;
  const list = lists[citasTab];
  if (!list.length) {
    const msg = { prox: 'No tienes citas próximas.', porag: 'No hay órdenes pendientes de agendar. Cuando te den una orden médica sin fecha, fotografíala y quedará aquí hasta que pidas la hora.', hist: 'Aún no hay citas realizadas.' }[citasTab];
    h += `<div class="card pad muted" style="margin-top:12px">${msg}</div>`;
  } else if (citasTab === 'porag') {
    h += `<div class="card" style="margin-top:12px">${list.map(a => apptCard(a)).join('')}</div>`;
  } else {
    let cur = '';
    for (const a of list) {
      const mk = a.date.slice(0, 7);
      if (mk !== cur) {
        if (cur) h += '</div>';
        cur = mk; h += `<div class="hday"><div class="h"><span>${esc(parseYmd(a.date).toLocaleDateString('es-CL', { month: 'long', year: 'numeric' }))}</span></div><div class="card">`;
      }
      h += apptCard(a);
    }
    h += '</div></div>';
  }
  $('#view').innerHTML = h;
  $('#cScan').onclick = scanSheet;
  $('#cManual').onclick = () => apptForm();
  document.querySelectorAll('[data-ct]').forEach(b => b.onclick = () => { citasTab = b.dataset.ct; renderCitas(); });
  document.querySelectorAll('[data-appt]').forEach(r => r.onclick = () => apptSheet(r.dataset.appt));
}

function reviewSheet(f, citas, res) {

  return h;
}
function tickAppts(now, today) {
  let changed = false; const multi = S.profiles.length > 1;
  for (const a of S.appts) {
    if (a.status !== 'pendiente' || !a.date) continue;
    const at = apptTime(a).getTime(); if (now > at + 3600000) continue;
    const due = (a.reminders || []).filter(m => now >= at - m * 60000 && !S.notified[`appt|${a.id}|${m}`]);
    if (!due.length) continue;
    due.forEach(m => S.notified[`appt|${a.id}|${m}`] = ymd(today)); changed = true;
    const who = multi ? ` (${(S.profiles.find(p => p.id === a.profileId) || {}).name})` : '';
    const t = ATYPES[a.type] || ATYPES.otro, rel = relDay(a.date);
    notify(`${t.i} ${a.title}${who}`, `${rel ? rel + ' ' : fmtDayShort(parseYmd(a.date)) + ' '}${a.time ? 'a las ' + a.time : ''}${a.place ? ' · ' + a.place : ''}${a.prep ? ' · ' + a.prep : ''}`, 'appt-' + a.id);
  }
  return changed;
}
function icsAppts(L, stamp, fmt) {
  const now = Date.now();
  for (const a of myAppts()) {
    if (a.status !== 'pendiente' || !a.date || apptTime(a).getTime() < now) continue;
    const t = ATYPES[a.type] || ATYPES.otro;
    const desc = [a.professional, (a.items || '').replace(/\n/g, ', '), a.prep ? 'Preparación: ' + a.prep : '', a.phone ? 'Tel: ' + a.phone : '', a.notes].filter(Boolean).join('\n');
    L.push('BEGIN:VEVENT', `UID:${a.id}@pastillero`, `DTSTAMP:${stamp}`);
    if (a.time) { const st = apptTime(a); L.push(`DTSTART:${fmt(st)}`, `DTEND:${fmt(new Date(st.getTime() + 3600000))}`); }
    else L.push(`DTSTART;VALUE=DATE:${a.date.replace(/-/g, '')}`, `DTEND;VALUE=DATE:${ymd(addDays(parseYmd(a.date), 1)).replace(/-/g, '')}`);
    L.push(`SUMMARY:${icsEsc(t.i + ' ' + a.title)}`, a.place ? `LOCATION:${icsEsc(a.place)}` : '', desc ? `DESCRIPTION:${icsEsc(desc)}` : '');
    for (const m of (a.reminders || [])) {
      const mins = a.time ? m : m - 540; // sin hora: relativo a las 9:00 del día
      L.push('BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsEsc(a.title)}`, `TRIGGER:${mins >= 0 ? '-' : ''}PT${Math.abs(mins)}M`, 'END:VALARM');
    }
    L.push('END:VEVENT');
  }
}

// ---------- instalación ----------
let deferredInstall = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; if (view === 'hoy' || view === 'ajustes') render(); });
async function doInstall() { if (!deferredInstall) return; deferredInstall.prompt(); await deferredInstall.userChoice; deferredInstall = null; render(); }
function installHint() {
  if (isStandalone()) return '';
  if (deferredInstall) return `<div class="alert info" style="margin-top:16px"><div class="grow"><b>Instala Pastillero</b><br>Ábrela como app y recibe avisos.</div><button class="btn sm pri" id="instBtn">Instalar</button></div>`;
  if (isIOS()) return `<div class="alert info" style="margin-top:16px"><div class="grow"><b>Instálala en tu iPhone:</b> toca <b>Compartir</b> (cuadrado con flecha) y luego “Agregar a inicio”. Así funcionan los avisos.</div></div>`;
  return '';
}
function pillSvg() { return `<svg viewBox="0 0 64 64" aria-hidden="true"><g transform="rotate(-40 32 32)"><rect x="8" y="21" width="48" height="22" rx="11" fill="var(--pri-soft)" stroke="var(--pri)" stroke-width="2.5"/><path d="M32 21h13a11 11 0 0 1 0 22H32z" fill="var(--pri)"/></g></svg>`; }

// ---------- arranque ----------
load();
$('#tabs').addEventListener('click', e => { const b = e.target.closest('button[data-v]'); if (b) setView(b.dataset.v); });
$('#fab').onclick = () => view === 'citas' ? scanSheet() : medForm();
$('#profileChip').onclick = profileSwitcher;
window.addEventListener('scroll', () => $('#top').classList.toggle('scrolled', scrollY > 4), { passive: true });
document.addEventListener('pointerdown', unlockAudio, { once: true });

function handleAction(type, key) {
  if (!key) return;
  const m = medById(key.split('|')[0]); if (!m) return;
  if (m.profileId !== S.active) S.active = m.profileId;
  if (type === 'take') { takeDose(key, new Date()); toast('Toma registrada ✓'); setView('hoy'); }
  else { setView('hoy'); doseSheet(key); }
}
const qp = new URLSearchParams(location.search);
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => { });
  navigator.serviceWorker.addEventListener('message', e => { if (e.data && e.data.type) handleAction(e.data.type, e.data.key); });
}
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) { }
render();
if (qp.get('take') || qp.get('open')) { handleAction(qp.get('take') ? 'take' : 'open', qp.get('take') || qp.get('open')); history.replaceState(null, '', location.pathname); }

tick();
setInterval(() => { tick(); if (view === 'hoy' && !sheet.open) renderHoy(); }, 30000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { load(); logIdx = null; tick(); if (!sheet.open) render(); } });
</script>
